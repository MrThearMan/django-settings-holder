[project]
name = "django-settings-holder"
version = "0.3.0"
description = "Object that allows settings to be accessed with attributes."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "settings",
    "holder",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://mrthearman.github.io/django-settings-holder"
"Repository" = "https://github.com/MrThearMan/django-settings-holder"
"Bug Tracker" = "https://github.com/MrThearMan/django-settings-holder/issues"
"Documentation" = "https://mrthearman.github.io/django-settings-holder"

[project.entry-points.pytest11]
django_settings_holder = "settings_holder.fixtures"

[tool.poetry]
requires-poetry = ">=2.0.0"
packages = [
    { include = "settings_holder" },
]

[tool.poetry.dependencies]
Django = ">=5.2.17"

[tool.poetry.group.test.dependencies]
pytest = "9.1.1"
pytest-django = "4.14.0"
coverage = "7.16.2"
tox = "4.64.7"
tox-gh-actions = "3.5.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.1"
pymdown-extensions = "12.1"
pygments = "2.21.0"
mkdocs-mermaid2-plugin = "1.2.3"

[tool.poetry.group.lint.dependencies]
pre-commit = "4.6.2"

[tool.coverage.run]
relative_files = true
branch = true
source = [
    "settings_holder/",
]

[tool.coverage.report]
omit = [
    "example_project/*",
    "tests/*",
    "docs/*",
    ".venv/*",
    ".tox/*",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "pragma: no cover",
    "pass",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.project.settings"
addopts = "--disable-warnings"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
